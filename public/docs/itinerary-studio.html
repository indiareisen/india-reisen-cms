<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Itinerary Studio — Builder &amp; Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Yatra+One&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  /* ============ APP CHROME (builder UI — not exported) ============ */
  :root{
    --app-bg:#EDEBE6; --app-panel:#FFFFFF; --app-ink:#241D18; --app-line:#DDD8CC;
    --app-accent:#7A2A2E; --app-accent-2:#C8973C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{
    font-family:'Karla',sans-serif; background:var(--app-bg); color:var(--app-ink);
    font-size:14px;
  }
  .app-header{
    background:#161022; color:#F6EFE1; padding:14px 22px; display:flex; align-items:center;
    justify-content:space-between; gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:100;
  }
  .app-header h1{
    font-family:'Fraunces',serif; font-size:1.05rem; margin:0; font-weight:600;
  }
  .app-header .sub{font-size:0.74rem; opacity:0.65; margin-top:2px;}
  .app-header .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{
    font-family:'Karla',sans-serif; font-size:0.78rem; font-weight:600; letter-spacing:0.02em;
    border:1px solid var(--app-accent-2); background:transparent; color:#F6EFE1;
    padding:8px 14px; border-radius:2px; cursor:pointer; white-space:nowrap;
  }
  .btn.primary{background:var(--app-accent-2); color:#241D18; border-color:var(--app-accent-2);}
  .btn:hover{opacity:0.85;}
  .btn.small{padding:5px 9px; font-size:0.72rem;}
  .btn.ghost{border-color:var(--app-line); color:var(--app-ink); background:#fff;}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .btn:disabled:hover{opacity:0.35;}

  .layout{display:grid; grid-template-columns:420px 1fr; min-height:calc(100vh - 58px);}
  @media (max-width:980px){ .layout{grid-template-columns:1fr;} }

  .panel-form{
    background:var(--app-panel); border-right:1px solid var(--app-line);
    max-height:calc(100vh - 58px); overflow-y:auto;
  }
  @media (max-width:980px){ .panel-form{max-height:none; border-right:none; border-bottom:1px solid var(--app-line);} }
  .panel-preview{background:#EDEBE6; max-height:calc(100vh - 58px); overflow-y:auto;}
  @media (max-width:980px){ .panel-preview{max-height:none;} }
  .preview-shell{padding:22px; }
  .preview-doc{background:#F6EFE1; box-shadow:0 12px 34px rgba(0,0,0,0.18); overflow:hidden;}

  .form-section{padding:18px 20px; border-bottom:1px solid var(--app-line);}
  .form-section h2{
    font-family:'Fraunces',serif; font-size:0.95rem; margin:0 0 4px; font-weight:700;
  }
  .form-section .hint{font-size:0.74rem; color:#6b6459; margin:0 0 12px;}
  label.f{display:block; font-size:0.72rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; color:var(--app-accent); margin:10px 0 4px;}
  input[type=text], input[type=number], textarea, select{
    width:100%; font-family:'Karla',sans-serif; font-size:0.86rem; padding:8px 9px;
    border:1px solid var(--app-line); border-radius:2px; background:#fff; color:var(--app-ink);
  }
  textarea{resize:vertical; min-height:52px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 90px; gap:8px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}

  .stop-card{
    border:1px solid var(--app-line); border-radius:3px; margin-bottom:14px; background:#FBFAF7;
  }
  .stop-card .stop-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; background:#241D18; color:#F6EFE1; border-radius:2px 2px 0 0;
  }
  .stop-head .num{
    font-family:'Fraunces',serif; font-weight:700; color:var(--app-accent-2); margin-right:8px;
  }
  .stop-head .mini-actions{display:flex; gap:4px;}
  .stop-body{padding:12px;}
  .checkline{display:flex; align-items:center; gap:6px; margin-top:10px; font-size:0.78rem;}
  .transport-strip{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--app-line);
  }
  .transport-strip .f{color:var(--app-accent-2);}

  .add-row{
    width:100%; padding:10px; border:1.5px dashed var(--app-accent-2); background:transparent;
    color:var(--app-accent); font-weight:700; font-size:0.8rem; border-radius:3px; cursor:pointer;
  }
  .note-card{border:1px solid var(--app-line); border-radius:3px; padding:10px 12px; margin-bottom:10px; background:#FBFAF7;}
  .note-card .stop-head{padding:0 0 6px;}

  .stat-pill{
    display:inline-block; font-size:0.72rem; background:#fff; border:1px solid var(--app-line);
    padding:3px 8px; border-radius:20px; margin:2px 4px 2px 0; color:#5b564c;
  }

  /* ---- bank UI ---- */
  .bank-row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .bank-panel{
    display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; padding:9px;
    background:#F1EEE6; border:1px solid var(--app-line); border-radius:3px;
  }
  .chip{display:inline-flex; align-items:center; background:#fff; border:1px solid var(--app-line); border-radius:20px; overflow:hidden; font-size:0.74rem;}
  .chip-add{border:none; background:transparent; padding:5px 9px; cursor:pointer; color:var(--app-ink); font-family:'Karla',sans-serif;}
  .chip-add:hover{color:var(--app-accent);}
  .chip-x{border:none; border-left:1px solid var(--app-line); background:transparent; padding:5px 8px; cursor:pointer; color:#a33; font-size:0.8rem;}
  .bank-panel-list{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
  .bank-note{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
    background:#F1EEE6; border:1px solid var(--app-line); border-radius:3px; padding:8px 10px;
  }
  .bank-note .hint{margin:2px 0 0;}
  .save-hint{font-size:0.7rem; color:#8a8272; margin-top:6px;}
  .hero-thumb-preview{margin-top:8px; border-radius:6px; overflow:hidden; border:1px solid #e4dfd3; height:90px;}
  .hero-thumb-preview img{width:100%; height:100%; object-fit:cover; display:block;}
  .save-status{font-size:0.72rem; margin-left:8px;}
  .build-stamp{font-size:0.68rem; margin-left:8px; opacity:0.45; font-family:'Karla',monospace; letter-spacing:0.02em;}
  #btnHardReset{border-color:#b34a3f; color:#b34a3f;}
  .save-status.saving{color:#c8973c;}
  .save-status.ok{color:#8fae7f;}
  .save-status.err{color:#e08a7d;}

  .admin-section{background:#F4F1E9; border-bottom:2px solid var(--app-accent-2);}
  .admin-section h2::before{content:"⚙ "; }
  input[type=color]{width:100%; height:36px; padding:2px; cursor:pointer;}
  .logo-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .logo-row img{height:32px; width:auto; max-width:120px; object-fit:contain; border:1px solid var(--app-line); background:#fff; padding:3px;}

  .gt-widget-header{display:inline-flex; align-items:center; min-height:36px;}
  .gt-widget-header select.goog-te-combo{font-family:'Karla',sans-serif; font-size:0.78rem; padding:7px 8px; border:1px solid var(--app-line); border-radius:2px;}

  /* Google injects the language list as its own iframe with a position it
     calculates itself — on a narrow header widget that math can place it
     partly off-screen. Overriding it here forces it to always open
     centered near the top of the viewport instead, so it's never
     unreachable regardless of where the trigger sits. */
  iframe.goog-te-menu-frame{
    position:fixed !important; top:64px !important; left:50% !important;
    transform:translateX(-50%) !important; margin:0 !important;
    max-width:min(480px,92vw) !important; max-height:70vh !important;
    box-shadow:0 14px 44px rgba(0,0,0,0.28) !important; border-radius:8px !important;
    z-index:99999 !important;
  }

  #previewRoot.editing{outline:3px dashed var(--app-accent-2); outline-offset:-3px; cursor:text;}
  .edit-banner{background:#FFF3CD; border-bottom:1px solid #E8B94A; color:#6b5410; padding:10px 20px; font-size:0.8rem; font-weight:600;}

  @media print{
    @page{ margin:0; }
    body{ margin:12mm 10mm; top:0 !important; }
    .app-header, .panel-form{display:none !important;}
    .layout{display:block !important;}
    .panel-preview{max-height:none !important; overflow:visible !important; background:#fff !important;}
    .preview-shell{padding:0 !important;}
    .preview-doc{box-shadow:none !important;}
    .goog-te-banner-frame, .goog-te-balloon-frame, iframe.skiptranslate,
    .gt-widget-header, .gt-widget{display:none !important;}
    .goog-text-highlight{background:none !important; box-shadow:none !important;}
  }

  /* ============ EXPORTED DOCUMENT STYLES (kept in a scoped block for reuse/export) ============ */
</style>
<style id="docStyles">
  #previewRoot{
    --ink:#1F2430; --paper:#F7F8FA; --paper-dim:#ECEEF1; --primary:#1D4E89; --accent:#9C7A3C;
    --line:rgba(31,36,48,0.13);
    --shadow:0 10px 28px rgba(20,24,32,0.08);
    font-family:'Karla', sans-serif; color:var(--ink); background:var(--paper); line-height:1.55; font-size:16px;
  }
  #previewRoot *{box-sizing:border-box;}
  #previewRoot h1,#previewRoot h2,#previewRoot h3,#previewRoot h4{font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-0.01em;}
  #previewRoot .eyebrow{font-family:'Yatra One',cursive; font-size:0.76rem; letter-spacing:0.13em; text-transform:uppercase; color:var(--accent);}
  #previewRoot .wrap{max-width:1000px; margin:0 auto; padding:0 26px;}

  #previewRoot .masthead{background:var(--paper); border-bottom:1px solid var(--line);}
  #previewRoot .mh-inner{display:flex; align-items:center; gap:12px; padding:16px 26px;}
  #previewRoot .mh-logo{height:30px; width:auto; object-fit:contain;}
  #previewRoot .mh-name{font-family:'Fraunces',serif; font-weight:700; font-size:1.08rem; color:var(--ink);}

  #previewRoot .hero{background:linear-gradient(180deg, var(--paper) 0%, var(--paper-dim) 100%); color:var(--ink); padding:52px 0 44px; position:relative; border-bottom:1px solid var(--line); overflow:hidden;}
  #previewRoot .hero::after{content:""; position:absolute; inset:auto 0 0 0; height:3px; background:linear-gradient(90deg, var(--primary), var(--accent)); z-index:2;}
  #previewRoot .hero .eyebrow{color:var(--accent);}
  #previewRoot .hero h1{font-size:clamp(1.7rem,4vw,2.6rem); color:var(--ink); margin:12px 0 14px; max-width:20ch;}
  #previewRoot .guest-line{font-family:'Fraunces',serif; font-style:italic; font-size:1.05rem; color:var(--ink); opacity:0.78; margin-top:10px;}
  #previewRoot .guest-line strong{font-style:normal; color:var(--primary);}
  #previewRoot .hero p.thesis{max-width:60ch; font-size:1rem; color:var(--ink); opacity:0.72; margin-bottom:20px;}
  #previewRoot .stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:22px;}
  #previewRoot .stat{min-width:120px; background:#fff; border:1px solid var(--line); border-left:3px solid var(--primary); padding:12px 16px;}
  #previewRoot .stat b{display:block; font-family:'Fraunces',serif; font-size:1.5rem; color:var(--primary);}
  #previewRoot .stat span{font-size:0.74rem; color:var(--ink); opacity:0.6; text-transform:uppercase; letter-spacing:0.03em;}
  #previewRoot .sample-flag{display:inline-block; margin-top:18px; border:1px solid var(--line); background:var(--paper); color:var(--ink); opacity:0.8; padding:6px 11px; font-size:0.74rem;}

  #previewRoot .hero.has-image{padding:110px 0 48px; border-bottom:none;}
  #previewRoot .hero-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;}
  #previewRoot .hero-scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,8,0.20) 0%, rgba(10,10,8,0.34) 55%, rgba(10,10,8,0.82) 100%); z-index:1; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  #previewRoot .hero.has-image .wrap{position:relative; z-index:2;}
  #previewRoot .hero.has-image .eyebrow{color:rgba(255,255,255,0.88);}
  #previewRoot .hero.has-image h1{color:#fff; text-shadow:0 2px 18px rgba(0,0,0,0.25);}
  #previewRoot .hero.has-image .guest-line{color:rgba(255,255,255,0.92);}
  #previewRoot .hero.has-image .guest-line strong{color:#fff;}
  #previewRoot .hero.has-image p.thesis{color:rgba(255,255,255,0.88); opacity:1;}
  #previewRoot .hero.has-image .stat{background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.28); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  #previewRoot .hero.has-image .stat b{color:#fff;}
  #previewRoot .hero.has-image .stat span{color:rgba(255,255,255,0.75);}
  #previewRoot .hero.has-image .sample-flag{background:rgba(255,255,255,0.14); border-color:rgba(255,255,255,0.3); color:#fff; opacity:1; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
  @media (max-width:680px){ #previewRoot .hero.has-image{padding:70px 0 36px;} }

  #previewRoot .route-section{background:var(--paper-dim); padding:0 0 40px; border-bottom:1px solid var(--line);}
  #previewRoot .route-strip{display:flex; align-items:flex-start; overflow-x:auto; padding:8px 0 14px;}
  #previewRoot .node{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; width:88px; padding-top:4px;}
  #previewRoot .node .dot{width:24px;height:24px;border-radius:50%; background:var(--paper); border:2px solid var(--primary); z-index:2; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:0.72rem; color:var(--primary);}
  #previewRoot .node .city{font-family:'Fraunces',serif; font-weight:600; font-size:0.8rem; color:var(--ink); margin-top:8px; text-align:center; line-height:1.2;}
  #previewRoot .node .nights{font-size:0.66rem; color:var(--primary); margin-top:2px;}
  #previewRoot .connector{flex:1 1 36px; min-width:36px; display:flex; align-items:center; justify-content:center; position:relative; top:16px; margin:0 -2px;}
  #previewRoot .connector .line{width:100%; height:0; border-top:2px dashed var(--line);}
  #previewRoot .connector .mode{position:absolute; background:var(--paper); border:1px solid var(--line); border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:0.72rem; color:var(--primary);}
  #previewRoot .route-caption{color:var(--ink); opacity:0.55; font-size:0.78rem; margin-top:2px;}

  #previewRoot .map-wrap{height:420px; width:100%; border:1px solid var(--line); background:var(--paper-dim);}
  #previewRoot .leaflet-container{font-family:'Karla',sans-serif; background:var(--paper-dim);}
  #previewRoot .map-legend{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:14px;}
  #previewRoot .legend-item{display:inline-flex; align-items:center; gap:7px; font-size:0.8rem; color:var(--ink); opacity:0.82;}
  #previewRoot .legend-line{display:inline-block; width:30px; height:0; border-top:3px solid var(--primary);}
  #previewRoot .legend-line.legend-flight{border-top-style:dotted; border-top-color:var(--accent); border-top-width:4px;}
  #previewRoot .legend-line.legend-train{border-top-style:dashed;}
  #previewRoot .legend-line.legend-ferry{border-top-style:dotted;}
  #previewRoot .legend-line.legend-walk{border-top-style:dotted; border-top-width:2px; opacity:0.7;}
  #previewRoot .map-note{font-size:0.78rem; color:var(--ink); opacity:0.55; margin-top:10px;}

  #previewRoot section{padding:48px 0;}
  #previewRoot section.alt{background:var(--paper-dim);}
  #previewRoot .section-head{margin-bottom:26px; max-width:64ch;}
  #previewRoot .sh-row{display:flex; align-items:center; gap:10px;}
  #previewRoot .sh-num{font-family:'Fraunces',serif; font-weight:600; font-size:0.78rem; color:var(--paper); background:var(--primary); width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;}
  #previewRoot .section-head h2{font-size:clamp(1.3rem,2.6vw,1.8rem); margin-top:8px;}
  #previewRoot .section-head p{color:var(--ink); opacity:0.7; margin-top:8px; font-size:0.92rem;}
  #previewRoot table{width:100%; border-collapse:collapse;}

  /* Itinerary timeline — a connected line of day badges grouped under each
     city, replacing a plain spreadsheet-style table with something a
     traveler actually wants to trace with their eye. */
  #previewRoot .itin-timeline{position:relative;}
  #previewRoot .itin-group{position:relative; padding-left:52px; margin-bottom:6px;}
  #previewRoot .itin-group::before{
    content:""; position:absolute; left:19px; top:34px; bottom:-6px; width:2px;
    background:linear-gradient(var(--line), var(--line)); z-index:0;
  }
  #previewRoot .itin-group:last-child::before{display:none;}
  #previewRoot .itin-city-head{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; position:relative;}
  #previewRoot .itin-city-dot{
    position:absolute; left:-52px; top:2px; width:40px; height:40px; border-radius:50%;
    background:var(--primary); flex:0 0 auto; z-index:1;
    display:flex; align-items:center; justify-content:center;
  }
  #previewRoot .itin-city-dot::after{content:"⚑"; color:var(--paper); font-size:1rem;}
  #previewRoot .itin-city-head h3{font-family:'Fraunces',serif; font-weight:700; font-size:1.25rem; color:var(--ink); margin:0;}
  #previewRoot .itin-city-nights{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--primary); background:var(--paper-dim); border:1px solid var(--line); padding:3px 9px; border-radius:20px;}
  #previewRoot .itin-day-row{display:flex; gap:16px; align-items:flex-start; padding:0 0 18px; position:relative;}
  #previewRoot .itin-day-badge{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%; background:#fff; border:2px solid var(--primary);
    color:var(--primary); font-family:'Fraunces',serif; font-weight:700; font-size:0.92rem;
    display:flex; align-items:center; justify-content:center; position:relative; left:-52px; margin-right:-52px; z-index:1;
  }
  #previewRoot .itin-day-body{flex:1; background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 16px; font-size:0.9rem; color:var(--ink); line-height:1.55; margin-left:0;}
  #previewRoot .itin-day-empty{opacity:0.55; font-style:italic;}
  @media (max-width:600px){
    #previewRoot .itin-group{padding-left:44px;}
    #previewRoot .itin-city-dot{left:-44px; width:34px; height:34px;}
    #previewRoot .itin-day-badge{left:-44px; margin-right:-44px; width:32px; height:32px; font-size:0.8rem;}
  }

  /* Sticky table-of-contents — appears once a document has enough sections
     to actually need wayfinding, sticks under the hero, and tracks scroll
     position so the current section is always visible at a glance. */
  #previewRoot .doc-toc{
    position:sticky; top:0; z-index:40; background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  #previewRoot .doc-toc-inner{
    max-width:1000px; margin:0 auto; padding:0 26px;
    display:flex; align-items:center; gap:18px; height:50px;
  }
  #previewRoot .toc-home{
    flex:0 0 auto; border:none; background:none; cursor:pointer; padding:0;
    font-family:'Fraunces',serif; font-weight:700; font-size:0.86rem; color:var(--primary);
    max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    border-right:1px solid var(--line); padding-right:16px;
  }
  #previewRoot .toc-links{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;}
  #previewRoot .toc-links::-webkit-scrollbar{display:none;}
  #previewRoot .toc-link{
    flex:0 0 auto; font-family:'Karla',sans-serif; font-size:0.78rem; font-weight:600; color:var(--ink); opacity:0.62;
    text-decoration:none; padding:8px 11px; border-radius:20px; white-space:nowrap; transition:opacity 0.15s, background 0.15s, color 0.15s;
  }
  #previewRoot .toc-link:hover{opacity:0.9; background:var(--paper-dim);}
  #previewRoot .toc-link.active{opacity:1; background:var(--primary); color:#fff;}

  #previewRoot .back-to-top{
    position:fixed; right:22px; bottom:22px; z-index:45; width:42px; height:42px; border-radius:50%;
    background:var(--primary); color:#fff; border:none; font-size:1.1rem; cursor:pointer;
    box-shadow:0 8px 22px rgba(20,24,32,0.24); opacity:0; pointer-events:none; transform:translateY(8px);
    transition:opacity 0.2s, transform 0.2s;
  }
  #previewRoot .back-to-top.visible{opacity:1; pointer-events:auto; transform:translateY(0);}
  #previewRoot .back-to-top:hover{filter:brightness(1.08);}
  @media (max-width:640px){ #previewRoot .toc-home{display:none;} #previewRoot .doc-toc-inner{padding:0 16px;} }

  #previewRoot .grid-2{display:grid; grid-template-columns:1.1fr 1fr; gap:32px;}

function __ensureAuthed(){
  return new Promise((resolve, reject) => {
    const unsub = onAuthStateChanged(__auth, (user) => {
      unsub();
      if (user) { resolve(user); return; }
      signInAnonymously(__auth).then(cred => resolve(cred.user)).catch(reject);
    });
  });
}

const CLIMATE_KEYWORDS = [
  [/leh|ladakh|nubra|kargil|zanskar|pangong|dras\b|khardung/i, "himalayaCold"],
  [/shimla|manali|darjeeling|ooty|munnar|nainital|mussoorie|gangtok|dharamshala|mcleod|coorg|kodaikanal|kalimpong|lachung|lachen|dalhousie|kasauli|almora|ranikhet|kathmandu|pokhara|nagarkot|bandipur\b/i, "hillStation"],
  [/kochi|cochin|kerala|alleppey|alappuzha|kumarakom|backwater|goa\b|mumbai|bombay|chennai|madras|mangalore|pondicherry|andaman|port blair|kanyakumari|calicut|kozhikode|thekkady|varkala|kovalam/i, "tropicalCoastal"],
  [/jaisalmer|bikaner|barmer|thar|khimsar|osian/i, "desertArid"],
  [/jaipur|jodhpur|udaipur|pushkar|ranthambore|ajmer|bharatpur|kota\b|bundi|chittorgarh|sawai madhopur|mount abu|nagaur|deogarh|pali\b/i, "semiAridWest"],

function climateProfileFor(city, lat){
  const c = (city||"");
  for(const [re, key] of CLIMATE_KEYWORDS){ if(re.test(c)) return CLIMATE_PROFILES[key]; }
  const latNum = parseFloat(lat);
  if(!isNaN(latNum)){
    if(latNum >= 32) return CLIMATE_PROFILES.himalayaCold;
    if(latNum <= 11) return CLIMATE_PROFILES.tropicalCoastal;
  }
  return CLIMATE_PROFILES.generic;
}
function hashCity(city){
  let h = 0;
  const s = (city||"").trim().toLowerCase();
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function defaultWeatherRow(city, lat){
  // Picks a starting climate curve based on the city/region so different
  // destinations read as genuinely different — Ladakh cold and dry, Kerala
  // warm and monsoon-heavy, Rajasthan's desert towns hot and arid — then
  // nudges every value by a small, deterministic per-city offset so two
  // cities in the same zone (e.g. Jaisalmer and Bikaner) don't come out
  // identical either. Every value stays fully editable per city afterward.
  const p = climateProfileFor(city, lat);
  const h = hashCity(city);
  const tempJitter = ((h % 91) / 10) - 4.5;          // ~ -4.5°C .. +4.5°C, unique per city
  const lowJitter = (((h >> 5) % 71) / 10) - 3.5;    // independent wobble for the low
  const rainMul = 0.7 + ((h >> 11) % 61) / 100;      // 0.70x .. 1.30x rainfall
  return p.high.map((hi,i)=>[
    Math.round(hi + tempJitter),
    Math.round(p.low[i] + tempJitter*0.6 + lowJitter*0.4),
    Math.max(0, Math.round(p.rain[i] * rainMul))
  ]);
}
function isValidWeatherRow(arr){
  // Catches anything that isn't a clean, real-looking 12-month curve: wrong
  // shape, missing/NaN values, impossible readings (negative rain, absurd
  // temperatures), or the old flat placeholder (every month identical).
  // Any of these get silently rebuilt from a fresh climate profile.
  if(!Array.isArray(arr) || arr.length !== 12) return false;
  for(const v of arr){
    if(!Array.isArray(v) || v.length !== 3) return false;
    const [h,l,r] = v;
    if(typeof h !== "number" || typeof l !== "number" || typeof r !== "number") return false;
    if(!isFinite(h) || !isFinite(l) || !isFinite(r)) return false;
    if(r < 0 || r > 1500) return false;          // rainfall can't be negative
    if(h < -40 || h > 55 || l < -40 || l > 55) return false; // outside any real climate on this route
    if(l > h) return false;                        // low can't exceed high
  }
  const [h0,l0,r0] = arr[0];
  if(arr.every(v=>v[0]===h0 && v[1]===l0 && v[2]===r0)) return false; // flat placeholder
  return true;
}
function normalizeStop(st){

  // exists, whatever shape the saved or imported data came in as.

  if(typeof st.nights !== "number" || !isFinite(st.nights) || st.nights < 0) st.nights = st.nights ? Number(st.nights)||1 : 1;
  if(typeof st.hotel !== "string") st.hotel = "";
  if(typeof st.note !== "string") st.note = "";
  if(typeof st.dayPlansRaw !== "string") st.dayPlansRaw = "";
  st.highlight = !!st.highlight;
  if(typeof st.highlightTitle !== "string") st.highlightTitle = "";
  if(typeof st.highlightText !== "string") st.highlightText = "";

/* ---- small color helpers for deriving shades from the admin's picked colors ---- */
function shade(hex, amt){
  let c = (hex||"#000000").replace('#','');
  if(c.length===3) c = c.split('').map(x=>x+x).join('');
  const num = parseInt(c,16) || 0;
  let r = (num>>16)+amt, g=((num>>8)&0xff)+amt, b=(num&0xff)+amt;
  r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
  return "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
/* ============================= IMAGE HANDLING ============================= */
// Uploaded photos get embedded directly into the trip's JSON (so the
// downloaded standalone file has no external dependencies) — but an
// unprocessed phone photo can be 5-8MB, and localStorage only allows
// ~5-10MB total. A few uploads at full resolution would blow that quota
// and bloat the exported HTML file badly. This resizes to a sane maximum
// dimension and re-encodes through a canvas before it ever touches state,
// typically cutting size by 80-95% with no visible quality loss at the
// sizes this document actually displays photos.
function compressImageFile(file, {maxDim=1600, quality=0.82, preservePng=false} = {}){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("Couldn't read that image file."));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const wantsPng = preservePng && /image\/png/.test(file.type);
        const dataUrl = wantsPng ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", quality);
        resolve({ dataUrl, originalBytes: file.size, newBytes: Math.round(dataUrl.length * 0.75) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function fmtBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return (n/1024).toFixed(0) + " KB";
  return (n/(1024*1024)).toFixed(1) + " MB";
}

function hexToRgba(hex, alpha){
  let c = (hex||"#000000").replace('#','');
  if(c.length===3) c = c.split('').map(x=>x+x).join('');
  const num = parseInt(c,16) || 0;
  const r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

  if(!isNaN(lat) && !isNaN(lng)) return [lat, lng];
  const key = (stop.city||"").trim().toLowerCase();

/* Looks a place up locally first (instant, works offline for ~40 common
   India/Nepal/Bhutan stops), then falls back to a live lookup against
   OpenStreetMap's free Nominatim geocoder for anything else. Requires the
   browser to have internet access — the local table alone still covers the
   most common stops without it. */
const geocodeCache = {};
async function geocodeCity(cityName){
  const key = (cityName||"").trim().toLowerCase();
  if(!key) return null;
  if(CITY_COORDS[key]) return CITY_COORDS[key];
  if(geocodeCache[key]) return geocodeCache[key];
  try{
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(cityName);
    const res = await fetch(url, { headers: { "Accept-Language": "en" } });
    if(!res.ok) return null;
    const data = await res.json();
    if(data && data[0]){
      const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      geocodeCache[key] = coords;
      return coords;
    }
  }catch(e){
    console.warn("Geocoding lookup failed (offline, or the request was blocked):", e);
  }
  return null;
}
async function autoLocateStop(i, force){
  const stop = state.stops[i];
  if(!stop || !stop.city.trim()) return;
  const hasCoords = stop.lat !== "" && stop.lat != null && stop.lng !== "" && stop.lng != null;
  if(hasCoords && !force) return;
  const statusEl = document.getElementById(`geoStatus-${i}`);
  if(statusEl) statusEl.textContent = "Locating…";
  const coords = await geocodeCity(stop.city);
  // the form may have re-rendered or the stop may have moved/been removed by the time this resolves
  if(!state.stops[i] || state.stops[i].city.trim().toLowerCase() !== stop.city.trim().toLowerCase()) return;
  if(coords){
    state.stops[i].lat = coords[0];
    state.stops[i].lng = coords[1];
    buildForm();
    renderPreview();
  }else{
    const el = document.getElementById(`geoStatus-${i}`);
    if(el) el.textContent = "Couldn't find that place — enter Lat/Lng manually.";
  }
}

// Approximates a flight path as a gentle arc instead of a straight line, by
// bowing a quadratic curve out from the midpoint perpendicular to the route.
function curvedPath(a, b){
  const dLat = b[0]-a[0], dLng = b[1]-a[1];
  const dist = Math.sqrt(dLat*dLat + dLng*dLng) || 0.0001;
  const midLat = (a[0]+b[0])/2, midLng = (a[1]+b[1])/2;
  const offset = dist * 0.15;
  const ctrl = [ midLat - (dLng/dist)*offset, midLng + (dLat/dist)*offset ];
  const pts = [];
  for(let t=0; t<=1.001; t+=0.05){
    pts.push([
      (1-t)*(1-t)*a[0] + 2*(1-t)*t*ctrl[0] + t*t*b[0],
      (1-t)*(1-t)*a[1] + 2*(1-t)*t*ctrl[1] + t*t*b[1]
    ]);
  }
  return pts;
}

  bus:    { dashArray:"16,5,2,5", weight:3.5 },
  ferry:  { dashArray:"1,8", weight:2.5 },
  walk:   { dashArray:"1,6", weight:2 }
};

function renderRouteMap(containerId, points, segments, theme){
  const el = document.getElementById(containerId);
  if(!el || typeof L === "undefined") return;
  if(el._leafletMap){ el._leafletMap.remove(); el._leafletMap = null; }
  if(!points.length) return;

  const map = L.map(containerId, { scrollWheelZoom:false });
  el._leafletMap = map;
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom:18
  }).addTo(map);

  segments.forEach(seg=>{
    const style = MODE_LINE_STYLE[seg.mode] || MODE_LINE_STYLE.car;
    const path = style.curved ? curvedPath(seg.from, seg.to) : [seg.from, seg.to];
    const isFlight = seg.mode === "flight";
    if(isFlight){
      // a soft white casing underneath makes the dashed arc read clearly over any tile colour
      L.polyline(path, { color:"#fff", weight:style.weight+3, opacity:0.9, lineCap:"round" }).addTo(map);
    }
    L.polyline(path, {
      color: isFlight ? theme.accent : theme.primary,
      weight: style.weight,
      dashArray: style.dashArray,
      opacity: isFlight ? 1 : 0.85,
      lineCap: "round"
    }).addTo(map);
    if(isFlight){
      const mid = path[Math.floor(path.length/2)];
      L.marker(mid, {
        icon: L.divIcon({
          className: "flight-icon",
          html: `<div style="transform:rotate(45deg); font-size:16px; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35));">✈</div>`,
          iconSize:[20,20], iconAnchor:[10,10]
        })
      }).addTo(map);
    }
  });

  const bounds = [];
  points.forEach((p,i)=>{
    L.circleMarker([p.lat,p.lng], {
      radius:7, weight:2, color:"#fff", fillColor:theme.primary, fillOpacity:1
    }).addTo(map).bindTooltip(`${i+1}. ${p.name}`);
    bounds.push([p.lat,p.lng]);
  });

  if(bounds.length > 1) map.fitBounds(bounds, { padding:[28,28] });
  else map.setView(bounds[0], 6);
}


function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function lines(raw){ return (raw||"").split("\n").map(s=>s.trim()).filter(Boolean); }
// Straight-line (great-circle) distance between two coordinates, in km.
// Deliberately NOT a driving/flying distance or duration estimate — actual
// travel distance can be far higher on mountain roads or indirect flight
// routes, so this is always labeled "straight-line" wherever it's shown.
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}
function sh(num, eyebrow, title){
  return `<div class="section-head"><div class="sh-row"><span class="sh-num">${num}</span><span class="eyebrow">${eyebrow}</span></div><h2>${title}</h2></div>`;
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* ============================= UNDO / REDO ============================= */
// Snapshots are plain JSON strings of `state` — simple, and correct by
// construction (no risk of a partial/aliased copy going stale). Scoped to
// the trip itself; branding, the bank, and the trip library have their own
// separate persistence and aren't part of this undo history.
let undoStack = [];
let redoStack = [];
let lastTypingSnapshotAt = 0;
const MUTATING_ACTIONS = new Set([
  "addPackItem","addPractItem","addStopPhotoUrl","delPackItem","delPractItem",
  "down","duplicateStop","regenWeatherAll","regenWeatherCity","removeChecklist",
  "removeDo","removeDont","removeEmergencyContact","removeNote","removeStop",
  "removeStopPhoto","up"
]);
const MUTATING_BUTTON_IDS = new Set([
  "btnAddChecklist","btnAddDo","btnAddDont","btnAddEmergencyContact","btnAddNote",
  "btnAddStop","btnLoadSample","btnRemoveHeroImage"
]);
function snapshotState(){
  // A snapshot is a full JSON copy of the trip — cheap for text edits, but
  // a stop with a few embedded photos can make a single snapshot several
  // MB. Capping only by count would let 60 such snapshots balloon into
  // hundreds of MB of JS heap, so this also caps total accumulated size.
  const json = JSON.stringify(state);
  undoStack.push(json);
  let totalBytes = 0;
  for(const s of undoStack) totalBytes += s.length;
  const MAX_UNDO_BYTES = 15_000_000;
  while(undoStack.length > 1 && (undoStack.length > 60 || totalBytes > MAX_UNDO_BYTES)){
    totalBytes -= undoStack[0].length;
    undoStack.shift();
  }
  redoStack = [];
  updateUndoRedoButtons();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  ensureExtraFields(state);
  activeWeatherCity = (state.stops[0]||{}).city || "";
  buildForm(); renderPreview(); saveTripDebounced();
  updateUndoRedoButtons();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  state = JSON.parse(redoStack.pop());
  ensureExtraFields(state);
  activeWeatherCity = (state.stops[0]||{}).city || "";
  buildForm(); renderPreview(); saveTripDebounced();
  updateUndoRedoButtons();
}
function updateUndoRedoButtons(){
  const u = document.getElementById("btnUndo"), r = document.getElementById("btnRedo");
  if(u) u.disabled = undoStack.length === 0;
  if(r) r.disabled = redoStack.length === 0;
}
document.addEventListener("keydown", (e)=>{
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  const inTextField = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if(inTextField) return; // let the browser's own field-level undo handle this
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase()==="z" && !e.shiftKey){ e.preventDefault(); undo(); }
  else if(mod && (e.key.toLowerCase()==="y" || (e.key.toLowerCase()==="z" && e.shiftKey))){ e.preventDefault(); redo(); }
});

function renderWeatherFormTable(){
  const key = activeWeatherCity.trim().toLowerCase();
  const data = state.weather[key];

  let rows = `<table class="mini-table" style="margin-top:10px;"><tr><th>Month</th><th>High °C</th><th>Low °C</th><th>Rain mm</th></tr>`;
  MONTH_NAMES.forEach((m,i)=>{
    rows += `<tr><td>${m}</td>
      <td><input type="number" style="padding:4px 6px;" value="${data[i][0]}" data-act="wx" data-city="${esc(key)}" data-m="${i}" data-f="0"></td>
      <td><input type="number" style="padding:4px 6px;" value="${data[i][1]}" data-act="wx" data-city="${esc(key)}" data-m="${i}" data-f="1"></td>
      <td><input type="number" style="padding:4px 6px;" value="${data[i][2]}" data-act="wx" data-city="${esc(key)}" data-m="${i}" data-f="2"></td></tr>`;

function bestMonths(data){
  const scored = data.map((v,i)=>({i, score: v[0] + v[2]*0.15}));
  scored.sort((a,b)=>a.score-b.score);
  return scored.slice(0,3).map(s=>s.i).sort((a,b)=>a-b).map(i=>MONTH_NAMES[i]).join(", ");
}
function monthReadout(data, idx, cityLabel){
  const [h,l,r] = data[idx];
  const rClamped = Math.max(0, r);
  const scores = data.map(v=>v[0] + Math.max(0,v[2])*0.15);
  const sorted = scores.slice().sort((a,b)=>a-b);
  const rank = sorted.indexOf(scores[idx]);
  const pct = rank / (scores.length - 1);
  const verdict = pct <= 0.25 ? "one of the best months to go"
    : pct <= 0.5 ? "a good time to go"
    : pct <= 0.75 ? "workable, but not the ideal window"
    : "the toughest month for weather on this route";
  return `<b>${MONTH_NAMES[idx]} in ${esc(cityLabel)}:</b> around ${h}°C high / ${l}°C low, ~${rClamped}mm of rain — ${verdict}.`;
}
/* Hand-built inline SVG chart — deliberately has zero external dependency
   (no CDN script to load, nothing that can fail silently offline or behind
   a firewall) and prints cleanly since it's plain markup, not a canvas. */
function weatherChartSVG(data, theme, highlightMonth){
  const W = 640, H = 230, mL = 40, mR = 40, mT = 14, mB = 26;
  const pW = W - mL - mR, pH = H - mT - mB;
  const highs = data.map(v=>v[0]), lows = data.map(v=>v[1]), rains = data.map(v=>Math.max(0,v[2]));
  let tMax = Math.ceil(Math.max(...highs, 30) / 5) * 5 + 5;
  let tMin = Math.floor(Math.min(...lows, 0) / 5) * 5;
  if(tMax - tMin < 20) tMax = tMin + 20;
  const rMax = Math.max(Math.ceil(Math.max(...rains, 10) / 50) * 50, 50);

  const xFor = i => mL + (i + 0.5) * (pW / 12);
  const yForT = t => mT + pH - ((t - tMin) / (tMax - tMin)) * pH;
  const yForR = r => mT + pH - (r / rMax) * pH;
  const barW = (pW / 12) * 0.5;
  const colW = pW / 12;

  let highlight = "";
  if(highlightMonth != null && highlightMonth >= 0 && highlightMonth < 12){
    const hx = mL + highlightMonth * colW;
    highlight = `<rect x="${hx.toFixed(1)}" y="${mT.toFixed(1)}" width="${colW.toFixed(1)}" height="${pH.toFixed(1)}" fill="${hexToRgba(theme.accent,0.12)}"></rect>`;
  }

  const bars = rains.map((r,i)=>{
    const x = xFor(i) - barW/2, y = yForR(r), h = (mT+pH) - y;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" fill="${hexToRgba(theme.primary,0.18)}" rx="1.5"></rect>`;
  }).join("");

  const linePath = (vals) => vals.map((v,i)=>`${i===0?'M':'L'}${xFor(i).toFixed(1)},${yForT(v).toFixed(1)}`).join(" ");
  const dots = (vals, color) => vals.map((v,i)=>{
    const r = (i===highlightMonth) ? 4.2 : 2.6;
    return `<circle cx="${xFor(i).toFixed(1)}" cy="${yForT(v).toFixed(1)}" r="${r}" fill="${color}"></circle>`;
  }).join("");

  let grid = "";
  for(let s=0;s<=4;s++){
    const t = tMin + (tMax-tMin)*s/4, y = yForT(t), r = rMax*s/4;
    grid += `<line x1="${mL}" y1="${y.toFixed(1)}" x2="${(mL+pW).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e7e2d8" stroke-width="1"></line>`;
    grid += `<text x="${(mL-8).toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="9" text-anchor="end" fill="#8a8578" font-family="Karla,sans-serif">${Math.round(t)}°</text>`;
    grid += `<text x="${(mL+pW+8).toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="9" text-anchor="start" fill="#8a8578" font-family="Karla,sans-serif">${Math.round(r)}mm</text>`;
  }
  const labels = MONTH_NAMES.map((m,i)=>`<text x="${xFor(i).toFixed(1)}" y="${(mT+pH+18).toFixed(1)}" font-size="10" text-anchor="middle" font-weight="${i===highlightMonth?700:400}" fill="${i===highlightMonth?theme.accent:'#5b5748'}" font-family="Karla,sans-serif">${m}</text>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="max-width:100%; display:block;">
      ${highlight}${grid}${bars}
      <path d="${linePath(highs)}" fill="none" stroke="${theme.accent}" stroke-width="2"></path>
      <path d="${linePath(lows)}" fill="none" stroke="${theme.primary}" stroke-width="2"></path>
      ${dots(highs, theme.accent)}${dots(lows, theme.primary)}
      ${labels}
    </svg>
    <div class="wx-legend">
      <span><i style="background:${theme.accent}"></i>High °C</span>
      <span><i style="background:${theme.primary}"></i>Low °C</span>
      <span><i style="background:${hexToRgba(theme.primary,0.35)}"></i>Rainfall (mm)</span>
    </div>`;
}

/* structural helpers */
function setDeep(path, value){
  const parts = path.split(".");
  let obj = state;
  if(parts[0] === "branding"){ obj = branding; parts.shift(); }
  for(let i=0;i<parts.length-1;i++){
    obj = obj[parts[i]];
  }
  obj[parts[parts.length-1]] = value;
}

formRoot.addEventListener("input", (e)=>{
  if(e.target.id === "tripBankSearch"){
    const terms = e.target.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const sel = document.getElementById("sampleSelect");
    const countEl = document.getElementById("tripBankSearchCount");
    if(sel){
      let shown = 0;
      Array.from(sel.options).forEach(opt=>{
        if(!opt.value){ return; }
        const text = opt.textContent.toLowerCase();
        const match = !terms.length || terms.every(t=>text.includes(t));
        opt.hidden = !match;
        if(match) shown++;
      });
      if(countEl) countEl.textContent = terms.length ? `${shown} trip${shown===1?"":"s"} match "${terms.join(" + ")}"` : "";
    }
    return;
  }
  if(e.target.dataset.act === "wx"){
    const city = e.target.dataset.city, m = Number(e.target.dataset.m), f = Number(e.target.dataset.f);
    if(!state.weather[city]) return;
    if(Date.now() - lastTypingSnapshotAt > 900){ snapshotState(); lastTypingSnapshotAt = Date.now(); }
    state.weather[city][m][f] = parseFloat(e.target.value) || 0;
    renderPreviewDebounced();
    saveTripDebounced();
    return;
  }
  const path = e.target.dataset.path;
  if(!path) return;
  let val = e.target.type === "checkbox" ? e.target.checked
           : e.target.type === "number" ? Number(e.target.value)
           : e.target.value;
  if(!path.startsWith("branding.") && Date.now() - lastTypingSnapshotAt > 900){
    snapshotState();
    lastTypingSnapshotAt = Date.now();
  }
  setDeep(path, val);
  if(path === "heroImageUrl" && state.heroImageDataUrl) state.heroImageDataUrl = "";
  renderPreviewDebounced();
  if(path.startsWith("branding.")) saveBrandingDebounced();
});

formRoot.addEventListener("change", (e)=>{
  if(e.target.id === "logoUpload"){
    const file = e.target.files[0];
    if(file){
      compressImageFile(file, { maxDim:500, preservePng:true }).then(({dataUrl})=>{
        branding.logoDataUrl = dataUrl;
        branding.logoUrl = "";
        saveBrandingDebounced();
        buildForm();
        renderPreview();
      }).catch(err=>alert("Couldn't process that image: " + err.message));
    }
    return;
  }
  if(e.target.id === "heroImageUpload"){
    const file = e.target.files[0];
    if(file){
      const status = document.getElementById("saveStatus");
      if(status) status.textContent = "Processing image…";
      compressImageFile(file, { maxDim:1920, quality:0.82 }).then(({dataUrl, originalBytes, newBytes})=>{
        snapshotState();
        state.heroImageDataUrl = dataUrl;
        state.heroImageUrl = "";
        saveTripDebounced();
        buildForm();
        renderPreview();
        if(status && originalBytes > 300000) status.textContent = `Compressed ${fmtBytes(originalBytes)} → ${fmtBytes(newBytes)}`;
      }).catch(err=>alert("Couldn't process that image: " + err.message));
    }
    return;
  }
  if(e.target.dataset.actUpload === "stopPhoto"){
    const idx = Number(e.target.dataset.i);
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    snapshotState();
    const status = document.getElementById("saveStatus");
    if(status) status.textContent = files.length>1 ? `Processing ${files.length} photos…` : "Processing photo…";
    let pending = files.length;
    let totalOrig = 0, totalNew = 0;
    files.forEach(file=>{
      compressImageFile(file, { maxDim:1600, quality:0.8 }).then(({dataUrl, originalBytes, newBytes})=>{
        if(state.stops[idx]) state.stops[idx].photos.push(dataUrl);
        totalOrig += originalBytes; totalNew += newBytes;
        pending--;
        if(pending === 0){
          buildForm(); renderPreview(); saveTripDebounced();
          if(status && totalOrig > 300000) status.textContent = `Compressed ${fmtBytes(totalOrig)} → ${fmtBytes(totalNew)}`;
        }
      }).catch(err=>{
        pending--;
        console.warn("One photo failed to process:", err);
        if(pending === 0){ buildForm(); renderPreview(); saveTripDebounced(); }
      });
    });
    return;
  }
  const path = e.target.dataset.path;
  if(!path) return;
  if(e.target.type === "checkbox"){
    // checkbox toggling the highlight fields needs a form rebuild to show/hide fields
    buildForm();
    renderPreview();
    return;
  }
  const m = path.match(/^stops\.(\d+)\.city$/);
  if(m){
    const idx = Number(m[1]);
    applyCityBank(idx);
    const stop = state.stops[idx];
    const city = stop.city.trim().toLowerCase();
    if(city){
      if(!state.weather[city]) state.weather[city] = defaultWeatherRow(stop.city, stop.lat);
      activeWeatherCity = stop.city;
    }
    buildForm();
    renderPreview();
    autoLocateStop(idx, false);
    return;
  }
  if(path === "heroImageUrl"){ buildForm(); renderPreview(); }
});

function applyCityBank(idx){
  const city = (state.stops[idx].city || "").trim();
  if(!city) return;
  const key = city.toLowerCase();
  const b = bank.cities[key];
  if(b){
    state.stops[idx] = {
      ...state.stops[idx],
      note: b.note ?? state.stops[idx].note,
      dayPlansRaw: b.dayPlansRaw ?? state.stops[idx].dayPlansRaw,
      highlight: !!b.highlight,
      highlightTitle: b.highlightTitle ?? state.stops[idx].highlightTitle,
      highlightText: b.highlightText ?? state.stops[idx].highlightText,
    };
  }
  // A city revisited later in the same trip (a hub you fly into and back
  // out of, say) almost always means the same hotel — fill it in from the
  // earlier stop automatically, but only if this stop's own hotel field is
  // still blank, so a deliberately different choice is never overwritten.
  if(!state.stops[idx].hotel){
    const earlier = state.stops.find((s,i)=>i!==idx && s.city.trim().toLowerCase()===key && s.hotel);
    if(earlier) state.stops[idx].hotel = earlier.hotel;
  }
  buildForm();
  renderPreview();
}

formRoot.addEventListener("click", (e)=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  const act = btn.dataset.act;
  const i = Number(btn.dataset.i);
  if(MUTATING_ACTIONS.has(act) || MUTATING_BUTTON_IDS.has(btn.id)) snapshotState();

  if(btn.id === "btnLoadSample"){
    const val = document.getElementById("sampleSelect").value;
    if(val.startsWith("lib:")){ libraryLoad(val.slice(4)); return; }
    const tpl = SAMPLE_TRIPS[val];
    if(tpl && confirm("Replace the current route with this sample? Your bank and branding are kept.")){
      state = JSON.parse(JSON.stringify(tpl));
      ensureExtraFields(state);
      activeWeatherCity = (state.stops[0]||{}).city || "";
      state.stops.forEach(s=>{
        if(!s.city.trim()) return;
        bank.cities[s.city.trim().toLowerCase()] = {
          city: s.city, note: s.note, dayPlansRaw: s.dayPlansRaw,
          highlight: s.highlight, highlightTitle: s.highlightTitle, highlightText: s.highlightText
        };
      });
      saveBank();
      buildForm();
      renderPreview();
    }
    return;
  }
  if(btn.id === "btnLibSave"){ librarySaveCurrent(); return; }
  if(btn.id === "btnLibUpdate"){
    const val = document.getElementById("sampleSelect").value;
    if(val.startsWith("lib:")) libraryUpdate(val.slice(4)); else alert("Select one of your saved trips first.");
    return;
  }
  if(btn.id === "btnLibDelete"){
    const val = document.getElementById("sampleSelect").value;
    if(val.startsWith("lib:")) libraryDelete(val.slice(4)); else alert("Select one of your saved trips first.");
    return;
  }
  if(act === "pickWeatherCity"){ activeWeatherCity = btn.dataset.city; buildForm(); renderPreview(); return; }
  if(act === "regenWeatherCity"){
    const key = activeWeatherCity.trim().toLowerCase();
    const stop = state.stops.find(s=>s.city.trim().toLowerCase()===key);
    if(key && stop){
      state.weather[key] = defaultWeatherRow(stop.city, stop.lat);
      buildForm();
      renderPreview();
    }
    return;
  }
  if(act === "regenWeatherAll"){
    if(!confirm("Rebuild weather for every city on this route from a fresh climate profile? Any manual edits will be lost.")) return;
    state.stops.forEach(s=>{
      const key = s.city.trim().toLowerCase();
      if(key) state.weather[key] = defaultWeatherRow(s.city, s.lat);
    });
    buildForm();
    renderPreview();
    return;
  }
  if(act === "removeChecklist"){ state.checklist.splice(i,1); buildForm(); renderPreview(); }
  if(btn.id === "btnAddChecklist"){ state.checklist.push({label:"New item…", done:false}); buildForm(); renderPreview(); }
  if(act === "removeDo"){ state.dos.splice(i,1); buildForm(); renderPreview(); }
  if(btn.id === "btnAddDo"){ state.dos.push("New tip…"); buildForm(); renderPreview(); }
  if(act === "removeDont"){ state.donts.splice(i,1); buildForm(); renderPreview(); }
  if(btn.id === "btnAddDont"){ state.donts.push("New caution…"); buildForm(); renderPreview(); }
  if(btn.id === "btnAddEmergencyContact"){
    state.emergencyContacts.push({ label:"", name:"", phone:"", note:"" });
    buildForm(); renderPreview();
  }
  if(act === "removeEmergencyContact"){ state.emergencyContacts.splice(i,1); buildForm(); renderPreview(); }
  if(btn.id === "btnRemoveLogo"){
    branding.logoUrl = ""; branding.logoDataUrl = "";
    saveBrandingDebounced();
    buildForm(); renderPreview();
    return;
  }
  if(btn.id === "btnRemoveHeroImage"){
    state.heroImageUrl = ""; state.heroImageDataUrl = "";
    saveTripDebounced();
    buildForm(); renderPreview();
    return;
  }
  if(act === "applyPreset"){
    branding.theme = { ...THEME_PRESETS[btn.dataset.preset] };
    saveBrandingDebounced();
    buildForm(); renderPreview();
    return;
  }

  if(act === "removeStop"){ state.stops.splice(i,1); buildForm(); renderPreview(); }
  if(act === "duplicateStop"){
    const copy = JSON.parse(JSON.stringify(state.stops[i]));
    state.stops.splice(i+1, 0, copy);
    buildForm();
    renderPreview();
    saveTripDebounced();
    return;
  }
  if(act === "locateStop"){ autoLocateStop(i, true); }
  if(act === "addStopPhotoUrl"){
    const field = formRoot.querySelector(`.new-photo-url[data-i="${i}"]`);
    const url = field ? field.value.trim() : "";
    if(url){
      state.stops[i].photos.push(url);
      buildForm(); renderPreview(); saveTripDebounced();
    }
    return;
  }
  if(act === "removeStopPhoto"){
    const pi = Number(btn.dataset.pi);
    state.stops[i].photos.splice(pi, 1);
    buildForm(); renderPreview(); saveTripDebounced();
    return;
  }
  if(act === "up" && i>0){ [state.stops[i-1],state.stops[i]] = [state.stops[i],state.stops[i-1]]; buildForm(); renderPreview(); }
  if(act === "down" && i<state.stops.length-1){ [state.stops[i+1],state.stops[i]] = [state.stops[i],state.stops[i+1]]; buildForm(); renderPreview(); }
  if(act === "removeNote"){ state.practical.splice(i,1); buildForm(); renderPreview(); }

  if(act === "saveCityBank"){
    const s = state.stops[i];
    const city = (s.city||"").trim();
    if(city){
      bank.cities[city.toLowerCase()] = {
        city: s.city, note: s.note, dayPlansRaw: s.dayPlansRaw,
        highlight: s.highlight, highlightTitle: s.highlightTitle, highlightText: s.highlightText
      };
      saveBank();
      buildForm();
    }
  }

  if(act === "savePackBank"){
    const cat = btn.dataset.cat;
    const current = lines(state.packing[cat]);
    const existing = bank.packing[cat] || [];
    current.forEach(item=>{
      if(!existing.some(x=>x.toLowerCase()===item.toLowerCase())) existing.push(item);
    });
    bank.packing[cat] = existing;
    saveBank();
    buildForm();
  }
  if(act === "togglePackBank"){
    const cat = btn.dataset.cat;
    packBankOpen[cat] = !packBankOpen[cat];
    buildForm();
  }
  if(act === "addPackItem"){
    const cat = btn.dataset.cat, idx = Number(btn.dataset.idx);
    const item = (bank.packing[cat]||[])[idx];
    const current = lines(state.packing[cat]);
    if(item && !current.some(x=>x.toLowerCase()===item.toLowerCase())){
      current.push(item);
      state.packing[cat] = current.join("\n");
    }
    buildForm();
    renderPreview();
  }
  if(act === "delPackItem"){
    const cat = btn.dataset.cat, idx = Number(btn.dataset.idx);
    bank.packing[cat].splice(idx,1);
    saveBank();
    buildForm();
  }

  if(act === "togglePractBank"){ practBankOpen = !practBankOpen; buildForm(); }
  if(act === "savePractItem"){
    const n = state.practical[i];
    const idx = bank.practical.findIndex(b=>b.title.trim().toLowerCase()===n.title.trim().toLowerCase() && n.title.trim());
    if(idx>=0) bank.practical[idx] = { ...n }; else bank.practical.push({ ...n });
    saveBank();
    buildForm();
  }
  if(act === "addPractItem"){
    const idx = Number(btn.dataset.idx);
    state.practical.push({ ...bank.practical[idx] });
    buildForm();
    renderPreview();
  }
  if(act === "delPractItem"){
    const idx = Number(btn.dataset.idx);
    bank.practical.splice(idx,1);
    saveBank();
    buildForm();
  }

  if(btn.id === "btnAddStop"){
    state.stops.push({ city:"New city", nights:1, hotel:"", note:"", dayPlansRaw:"", highlight:false, highlightTitle:"", highlightText:"", photos:[], lat:"", lng:"", transport:{mode:"car", duration:"", notes:""} });
    buildForm(); renderPreview();
  }
  if(btn.id === "btnAddNote"){
    state.practical.push({ title:"New note", text:"" });
    buildForm(); renderPreview();
  }
});

document.getElementById("btnPublish").addEventListener("click", async ()=>{
  const statusEl = document.getElementById("publishStatus");
  const showStatus = (msg, kind)=>{
    statusEl.style.display = "block";
    statusEl.textContent = msg;
    statusEl.style.background = kind === "error" ? "#fdecea" : (kind === "ok" ? "#e8f5e9" : "#eef2f6");
    statusEl.style.color = kind === "error" ? "#7A2A2E" : (kind === "ok" ? "#1a7a4c" : "#333");
  };

  if(!state.title || !state.title.trim()){
    showStatus("⚠ Add a trip title before publishing.", "error");
    return;
  }
  if(!state.stops || state.stops.length === 0){
    showStatus("⚠ Add at least one stop before publishing.", "error");
    return;
  }

  const btn = document.getElementById("btnPublish");
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = "Publishing…";
  showStatus("Publishing to reisenindia.com…", "info");

  try{
    const destination = state.stops.map(s => (s.city||"").trim()).filter(Boolean).join(", ");
    const totalNights = state.stops.reduce((sum, s) => sum + (Number(s.nights)||0), 0);
    const durationLabel = `${totalNights + 1} Days`;
    const featuredImage = (state.stops.find(s => s.photoUrl && s.photoUrl.trim()) || {}).photoUrl || "";

    if(!featuredImage){
      const proceed = confirm("No stop has a photo URL set, so this Journey card will publish without a featured image. Publish anyway?");
      if(!proceed){
        btn.disabled = false;
        btn.textContent = originalLabel;
        showStatus("Publish cancelled — add a photoUrl on a stop to include a featured image.", "error");
        return;
      }
    }

    const journeyData = {
      title: state.title.trim(),
      description: (state.thesis || "").trim(),
      destination,
      duration: durationLabel,
      difficulty: document.getElementById("pubDifficulty").value,
      price: Number(document.getElementById("pubPrice").value) || 0,
      currency: document.getElementById("pubCurrency").value,
      featuredImage
    };

    await window.__publishJourneyToFirestore(journeyData);
    showStatus(`✓ Published "${journeyData.title}" — it'll appear on the Journeys page now.`, "ok");
  }catch(err){
    console.error("Publish failed:", err);
    showStatus("⚠ Publish failed — check the browser console for details.", "error");
  }finally{
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

  var editModeStandalone = false;
  var tocObserverX = null;
  var backToTopHandlerX = null;
  function initTocX(){
    var toc = document.getElementById("docToc");

  function wireChrome(){

// Finds whichever ancestor actually scrolls — the builder scrolls inside
// .panel-preview, while a standalone downloaded document scrolls the
// whole window — so the same logic works correctly in both contexts.
function findScrollContainer(el){
  let node = el.parentElement;
  while(node && node !== document.body){
    const style = getComputedStyle(node);
    if(/(auto|scroll)/.test(style.overflowY) && node.scrollHeight > node.clientHeight + 2) return node;
    node = node.parentElement;
  }
  return null; // null means the window itself scrolls
}
let tocObserver = null;
let backToTopHandler = null;
function initTocScrollSpy(root){
  const toc = root.querySelector("#docToc");
  if(!toc) return;
  const scrollContainer = findScrollContainer(root);
  const links = Array.from(toc.querySelectorAll(".toc-link"));
  const sectionEls = Array.from(root.querySelectorAll('section[id^="sec-"]'));
  const setActive = id => links.forEach(l=>l.classList.toggle("active", l.dataset.toc === id));

  if(tocObserver) tocObserver.disconnect();
  if("IntersectionObserver" in window && sectionEls.length){
    tocObserver = new IntersectionObserver((entries)=>{
      const visible = entries.filter(e=>e.isIntersecting);
      if(visible.length){
        visible.sort((a,b)=>a.boundingClientRect.top - b.boundingClientRect.top);
        setActive(visible[0].target.id.replace("sec-",""));
      }
    }, { root: scrollContainer, rootMargin: "-70px 0px -70% 0px", threshold: 0 });
    sectionEls.forEach(s=>tocObserver.observe(s));
  }

  function scrollToTarget(target){
    if(!target) return;
    const navHeight = toc.offsetHeight;
    const containerTop = scrollContainer ? scrollContainer.getBoundingClientRect().top : 0;
    const targetTop = target.getBoundingClientRect().top;
    const currentScroll = scrollContainer ? scrollContainer.scrollTop : window.scrollY;
    const dest = currentScroll + (targetTop - containerTop) - navHeight - 14;
    (scrollContainer || window).scrollTo({ top: Math.max(0, dest), behavior: "smooth" });
  }
  toc.querySelectorAll(".toc-link").forEach(link=>{
    link.addEventListener("click", (e)=>{
      e.preventDefault();
      scrollToTarget(root.querySelector("#sec-" + link.dataset.toc));
    });
  });
  const homeBtn = toc.querySelector(".toc-home");
  if(homeBtn) homeBtn.addEventListener("click", ()=> (scrollContainer||window).scrollTo({ top:0, behavior:"smooth" }));

  const backBtn = root.querySelector("#backToTop");
  if(backBtn){
    backBtn.onclick = ()=> (scrollContainer||window).scrollTo({ top:0, behavior:"smooth" });
    const scrollTarget = scrollContainer || window;
    if(backToTopHandler) backToTopHandler.target.removeEventListener("scroll", backToTopHandler.fn);
    const toggleBack = ()=>{
      const y = scrollContainer ? scrollContainer.scrollTop : window.scrollY;
      backBtn.classList.toggle("visible", y > 500);
    };
    scrollTarget.addEventListener("scroll", toggleBack, { passive:true });
    backToTopHandler = { target: scrollTarget, fn: toggleBack };
    toggleBack();
  }
}

  selectedWeatherMonth = Number(e.target.value);
  updateWeatherPreview();
});

/* ============================= INIT ============================= */
async function init(){
  setSaveStatus("Loading…", "saving");
  try{
    const savedTrip = await storageGet("trip_v1");
    state = JSON.parse(savedTrip.value);
  }catch(e){
    // no saved trip yet — keep the built-in sample defined above
  }
  ensureExtraFields(state);
  activeWeatherCity = (state.stops[0]||{}).city || "";
  try{
    const savedBank = await storageGet("bank_v1");
    bank = normalizeBank(JSON.parse(savedBank.value));
  }catch(e){
    bank = defaultBank();
    saveBank();
  }
  try{
    const savedBranding = await storageGet("branding_v1");
    branding = normalizeBranding(JSON.parse(savedBranding.value));
  }catch(e){
    // no saved branding yet — keep the Professional Light default
  }
  buildForm();
  renderPreview();
  setSaveStatus("", "");
}
init();
</script>
